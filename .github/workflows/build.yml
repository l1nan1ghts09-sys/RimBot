name: build

on:
  push:
    branches: [ "arena/9ced95f9-rimbot" ]
    paths:
      - "Source/**"
      - "RimWorldBot.TradeEmpire.CI.csproj"
      - ".github/workflows/build.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Build addon
        run: dotnet build RimWorldBot.TradeEmpire.CI.csproj -c Release
      - uses: actions/upload-artifact@v4
        with:
          name: RimWorldBot.TradeEmpire
          path: out/RimWorldBot.TradeEmpire.dll
          if-no-files-found: error
      - name: Commit built DLL into Assemblies
        shell: bash
        run: |
          set -e
          cp out/RimWorldBot.TradeEmpire.dll Assemblies/RimWorldBot.TradeEmpire.dll
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Assemblies/RimWorldBot.TradeEmpire.dll
          if git diff --cached --quiet; then echo "DLL не изменилась"; exit 0; fi
          git commit -m "build: собрана RimWorldBot.TradeEmpire.dll [skip ci]"
          git push
